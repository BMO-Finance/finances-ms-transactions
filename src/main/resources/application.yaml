server:
  port: 8082
  
spring:
  application:
    name: finances-ms-transactions

  datasource:
    url: jdbc:postgresql://localhost:5432/financas_db
    username: admin 
    password: adminpassword
    driver-class-name: org.postgresql.Driver 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/